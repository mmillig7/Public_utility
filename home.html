<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Align — Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone phone--home">
      <div class="home-frame">
        <div class="home-top-bar">
          <span>Groups</span>
          <span class="chevron" aria-hidden="true">▼</span>
        </div>

        <div class="home-labels-row" aria-hidden="true">
          <span>March 2026</span>
          <span>April 2026</span>
          <span>May 2026</span>
          <span></span>
        </div>

        <div class="home-thumbs-row">
          <div class="home-thumb" role="presentation"></div>
          <div class="home-thumb" role="presentation"></div>
          <div class="home-thumb" role="presentation"></div>
          <div class="home-thumb" role="presentation"></div>
        </div>

        <h2 class="home-today">Today</h2>
        <button type="button" class="home-fab" aria-label="Add">+</button>

        <div class="home-list">
          <div class="home-list-placeholder" role="presentation"></div>
          <div class="home-list-placeholder" role="presentation"></div>
          <div class="home-list-placeholder" role="presentation"></div>
          <div class="home-list-placeholder" role="presentation"></div>
        </div>
      </div>

      <footer class="nav-footer">
        <a href="onboarding.html">Onboarding</a>
      </footer>
    </main>
  </body>
</html>
